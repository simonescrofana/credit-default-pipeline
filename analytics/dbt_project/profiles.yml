dbt_project:
  outputs:
    dev:
      dbname: "{{ env_var('POSTGRES_DB', 'insolvency_db') }}"
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      pass: "{{ env_var('POSTGRES_PASSWORD') }}"
      port: "{{ env_var('POSTGRES_PORT', '5433') | as_number }}"
      schema: public
      threads: 1
      type: postgres
      user: "{{ env_var('POSTGRES_USER', 'simone_scrofana') }}"
  target: dev
